[package]
name = "star_core"
version = "0.1.0"
edition = "2021"

[dependencies]
mlua = { version = "0.9", features = ["lua54", "vendored"] }
rand = "0.8"
glam = { version = "0.27", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
macroquad = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
